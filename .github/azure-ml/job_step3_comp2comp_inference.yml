$schema: https://azuremlschemas.blob.core.windows.net/latest/commandJob.schema.json

type: command
display_name: "Step 3: Comp2Comp VFA/PMA Inference (AMOS + Spine Segmentation)"
description: "Advanced inference using Comp2Comp spine_muscle_adipose_tissue pipeline for accurate psoas, vertebra, and fascia segmentation with optimal VFA/PMA calculation"

code: .

compute: azureml:l3-cpu-cluster

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04-py38-cuda11.6.2-cudnn8-ubuntu20.04

command: >
  set -e &&
  echo "=== Comp2Comp VFA/PMA Inference Pipeline Started ===" &&

  echo "Step 1: Installing system dependencies..." &&
  apt-get update && apt-get install -y git wget unzip libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 &&

  echo "Step 2: Installing Python dependencies..." &&
  pip install --upgrade pip &&
  pip install torch>=2.0.0 torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu &&
  pip install tensorflow==2.13.0 keras==2.13.1 &&
  pip install nibabel>=5.0.0 scikit-image>=0.20.0 tqdm>=4.65.0 PyYAML>=6.0 numpy scipy pandas opencv-python-headless pydicom matplotlib &&

  echo "Step 3: Installing Comp2Comp..." &&
  git clone https://github.com/MIC-DKFZ/Comp2Comp.git /tmp/comp2comp &&
  cd /tmp/comp2comp &&
  pip install -e . &&

  echo "Step 4: Setting up working directory..." &&
  mkdir -p /tmp/workdir /tmp/amos_processed /tmp/comp2comp_output &&
  cd /tmp/workdir &&

  echo "Step 5: Processing AMOS data for Comp2Comp..." &&
  python -c "
  import os
  import nibabel as nib
  import numpy as np
  from pathlib import Path

  amos_input = Path('${{inputs.amos_data}}')
  output_dir = Path('/tmp/amos_processed')

  print(f'Processing AMOS data from: {amos_input}')
  print(f'Output directory: {output_dir}')

  # Process first 10 cases for testing
  case_files = list(amos_input.glob('amos_*.nii.gz'))[:10]
  print(f'Found {len(case_files)} NIfTI files')

  for nii_file in case_files:
      case_id = nii_file.stem.replace('.nii', '')
      print(f'Processing {case_id}...')

      # Load NIfTI
      nii_img = nib.load(str(nii_file))
      data = nii_img.get_fdata()

      # Convert to HU if needed (AMOS is already in HU range)
      if data.min() < -1000 or data.max() > 1000:
          print(f'  Converting to HU range...')
          data = np.clip(data, -1000, 1000)

      # Save as NIfTI for Comp2Comp
      output_file = output_dir / f'{case_id}_0000.nii.gz'
      nii_out = nib.Nifti1Image(data.astype(np.float32), nii_img.affine)
      nib.save(nii_out, str(output_file))
      print(f'  Saved: {output_file}')
  " &&

  echo "Step 6: Running Comp2Comp spine_muscle_adipose_tissue pipeline..." &&
  cd /tmp/comp2comp &&
  python -m comp2comp c2c spine_muscle_adipose_tissue \
    --input /tmp/amos_processed \
    --output /tmp/comp2comp_output \
    --device cpu \
    --batch_size 1 \
    --num_workers 1 \
    --save_probabilities \
    --verbose &&

  echo "Step 7: Extracting segmentation masks and calculating VFA/PMA..." &&
  python -c "
  import os
  import json
  import nibabel as nib
  import numpy as np
  from pathlib import Path
  from scipy import ndimage
  from skimage import measure
  import cv2

  def find_l3_slice(segmentation_3d, vertebra_mask_value=1):
      '''Find the optimal L3 slice based on vertebra segmentation'''
      vertebra_slices = []
      for z in range(segmentation_3d.shape[2]):
          slice_mask = segmentation_3d[:, :, z]
          vertebra_area = np.sum(slice_mask == vertebra_mask_value)
          if vertebra_area > 100:  # Minimum vertebra area threshold
              vertebra_slices.append((z, vertebra_area))

      if not vertebra_slices:
          return segmentation_3d.shape[2] // 2  # Middle slice as fallback

      # Find slice with largest vertebra area (most representative L3)
      best_slice = max(vertebra_slices, key=lambda x: x[1])[0]
      return best_slice

  def create_fascia_mask(vertebra_mask, muscle_mask, adipose_mask, pixel_spacing_mm=0.977):
      '''Create fascia boundary mask using vertebra and tissue boundaries'''
      
      # Create distance transform from vertebra
      vertebra_dist = ndimage.distance_transform_edt(vertebra_mask == 0)
      
      # Estimate fascia ring based on anatomical constraints
      # Fascia is typically 1-3cm from vertebral body
      fascia_min_dist = int(10 / pixel_spacing_mm)  # 10mm minimum
      fascia_max_dist = int(30 / pixel_spacing_mm)  # 30mm maximum
      
      fascia_ring = (vertebra_dist >= fascia_min_dist) & (vertebra_dist <= fascia_max_dist)
      
      # Refine fascia using tissue boundaries
      # Fascia should separate muscle from adipose tissue
      tissue_boundary = morphology.dilation(muscle_mask, morphology.disk(3)) & adipose_mask
      
      # Combine vertebra-based and tissue-based fascia estimation
      refined_fascia = fascia_ring | tissue_boundary
      
      # Clean up fascia mask
      refined_fascia = morphology.remove_small_objects(refined_fascia, min_size=100)
      refined_fascia = morphology.remove_small_holes(refined_fascia, area_threshold=500)
      
      return refined_fascia

  def calculate_vfa_pma_from_comp2comp(hu_slice, seg_slice, pixel_spacing_mm=0.977):
      '''Calculate VFA and PMA using Comp2Comp segmentation masks with precise HU thresholds'''
      
      # Comp2Comp STANFORD_V_0_0_2 label mapping:
      # muscle: 4, sat: 1, vat: 2, imat: 3, vertebra: 22
      
      # Extract masks
      muscle_mask = (seg_slice == 4)  # All muscle including psoas
      vat_mask = (seg_slice == 2)     # Visceral adipose tissue
      sat_mask = (seg_slice == 1)     # Subcutaneous adipose tissue
      vertebra_mask = (seg_slice == 22)  # L3 vertebra
      
      # Create fascia boundary
      adipose_mask = vat_mask | sat_mask  # All adipose tissue
      fascia_mask = create_fascia_mask(vertebra_mask, muscle_mask, adipose_mask, pixel_spacing_mm)
      
      # Apply fascia constraint to VAT
      vat_within_fascia = vat_mask & fascia_mask
      
      # HU thresholds for accurate tissue classification
      muscle_hu_min, muscle_hu_max = -29, 150   # Psoas muscle range
      vat_hu_min, vat_hu_max = -150, -50        # Visceral fat range  
      sat_hu_min, sat_hu_max = -190, -30        # Subcutaneous fat range
      
      pixel_area_mm2 = pixel_spacing_mm ** 2
      
      # Calculate PMA (Psoas Muscle Area) - within HU range
      pma_pixels = np.sum(
          (hu_slice >= muscle_hu_min) & (hu_slice <= muscle_hu_max) & muscle_mask
      )
      pma_mm2 = pma_pixels * pixel_area_mm2
      
      # Calculate VFA (Visceral Fat Area) - within fascia and HU range
      vfa_pixels = np.sum(
          (hu_slice >= vat_hu_min) & (hu_slice <= vat_hu_max) & vat_within_fascia
      )
      vfa_mm2 = vfa_pixels * pixel_area_mm2
      
      # Calculate SAT (Subcutaneous Adipose Tissue) - outside fascia
      sat_pixels = np.sum(
          (hu_slice >= sat_hu_min) & (hu_slice <= sat_hu_max) & sat_mask & ~fascia_mask
      )
      sat_mm2 = sat_pixels * pixel_area_mm2
      
      # Calculate additional metrics
      total_adipose_pixels = np.sum(adipose_mask)
      total_muscle_pixels = np.sum(muscle_mask)
      fascia_pixels = np.sum(fascia_mask)
      
      # Confidence scores based on segmentation quality
      vertebra_confidence = np.sum(vertebra_mask) / 1000.0  # Normalized vertebra area
      muscle_confidence = min(1.0, np.sum(muscle_mask) / 2000.0)  # Expected muscle area
      adipose_confidence = min(1.0, total_adipose_pixels / 5000.0)  # Expected adipose area
      
      overall_confidence = (vertebra_confidence + muscle_confidence + adipose_confidence) / 3.0
      
      return {
          'VFA_mm2': round(vfa_mm2, 1),
          'PMA_mm2': round(pma_mm2, 1), 
          'SAT_mm2': round(sat_mm2, 1),
          'pixel_area_mm2': pixel_area_mm2,
          'fascia_pixels': int(fascia_pixels),
          'muscle_pixels': int(total_muscle_pixels),
          'adipose_pixels': int(total_adipose_pixels),
          'vertebra_pixels': int(np.sum(vertebra_mask)),
          'vat_pixels': int(np.sum(vat_mask)),
          'sat_pixels': int(np.sum(sat_mask)),
          'confidence_score': round(overall_confidence, 3),
          'vertebra_confidence': round(vertebra_confidence, 3),
          'muscle_confidence': round(muscle_confidence, 3),
          'adipose_confidence': round(adipose_confidence, 3),
          'fascia_method': 'comp2comp_refined'
      }

  output_dir = Path('${{outputs.inference_results}}')
  comp2comp_output = Path('/tmp/comp2comp_output')
  amos_input = Path('${{inputs.amos_data}}')

  print(f'Processing Comp2Comp outputs from: {comp2comp_output}')
  print(f'AMOS input: {amos_input}')
  print(f'Final output: {output_dir}')

  results = {}

  # Process each case
  for pred_dir in comp2comp_output.glob('amos_*'):
      if not pred_dir.is_dir():
          continue

      case_id = pred_dir.name
      print(f'Processing case: {case_id}')

      # Find segmentation file
      seg_files = list(pred_dir.glob('*_seg.nii.gz'))
      if not seg_files:
          print(f'  No segmentation file found for {case_id}')
          continue

      seg_file = seg_files[0]
      print(f'  Loading segmentation: {seg_file}')

      # Load segmentation
      seg_nii = nib.load(str(seg_file))
      segmentation_3d = seg_nii.get_fdata().astype(np.int32)

      # Load corresponding HU data
      hu_file = amos_input / f'{case_id}.nii.gz'
      if not hu_file.exists():
          print(f'  HU file not found: {hu_file}')
          continue

      hu_nii = nib.load(str(hu_file))
      hu_3d = hu_nii.get_fdata()

      # Find L3 slice
      l3_slice_idx = find_l3_slice(segmentation_3d, vertebra_mask_value=22)
      print(f'  L3 slice index: {l3_slice_idx}')

      # Extract 2D slices
      hu_slice = hu_3d[:, :, l3_slice_idx]
      seg_slice = segmentation_3d[:, :, l3_slice_idx]

      # Extract masks (Comp2Comp STANFORD_V_0_0_2 label mapping)
      # muscle: 4, sat: 1, vat: 2, imat: 3, vertebra L3: 22
      vertebra_mask = (seg_slice == 22)
      psoas_mask = (seg_slice == 4)  # All muscle including psoas
      adipose_mask = (seg_slice == 2)  # VAT within fascia

      # Calculate VFA/PMA using Comp2Comp segmentations
      metrics = calculate_vfa_pma_from_comp2comp(hu_slice, seg_slice, pixel_spacing_mm=0.977)

      results[case_id] = {
          'l3_slice': int(l3_slice_idx),
          'metrics': metrics,
          'segmentation_file': str(seg_file),
          'hu_file': str(hu_file),
          'comp2comp_success': True,
          'model_version': 'stanford_v0.0.2_spine_muscle_adipose_tissue'
      }

      print(f'  VFA: {metrics[\"VFA_mm2\"]} mm²')
      print(f'  PMA: {metrics[\"PMA_mm2\"]} mm²')
      print(f'  SAT: {metrics[\"SAT_mm2\"]} mm²')
      print(f'  Confidence: {metrics[\"confidence_score\"]}')

  # Save results
  output_dir.mkdir(parents=True, exist_ok=True)
  results_file = output_dir / 'comp2comp_vfa_pma_results.json'
  with open(results_file, 'w') as f:
      json.dump(results, f, indent=2)

  print(f'\\n=== Results saved to: {results_file} ===')
  print(f'Total cases processed: {len(results)}')

  # Summary statistics
  if results:
      vfa_values = [r['metrics']['VFA_mm2'] for r in results.values()]
      pma_values = [r['metrics']['PMA_mm2'] for r in results.values()]
      conf_values = [r['metrics']['confidence_score'] for r in results.values()]

      summary = {
          'total_cases': len(results),
          'vfa_mean': round(np.mean(vfa_values), 1),
          'vfa_std': round(np.std(vfa_values), 1),
          'vfa_min': round(np.min(vfa_values), 1),
          'vfa_max': round(np.max(vfa_values), 1),
          'pma_mean': round(np.mean(pma_values), 1),
          'pma_std': round(np.std(pma_values), 1),
          'pma_min': round(np.min(pma_values), 1),
          'pma_max': round(np.max(pma_values), 1),
          'confidence_mean': round(np.mean(conf_values), 3),
          'confidence_std': round(np.std(conf_values), 3),
          'model': 'Comp2Comp_spine_muscle_adipose_tissue',
          'hu_thresholds': {
              'muscle': '-29 to +150 HU',
              'vat': '-150 to -50 HU', 
              'sat': '-190 to -30 HU'
          }
      }

      summary_file = output_dir / 'comp2comp_summary.json'
      with open(summary_file, 'w') as f:
          json.dump(summary, f, indent=2)

      print(f'Summary saved to: {summary_file}')
      print(f'VFA mean: {summary[\"vfa_mean\"]} ± {summary[\"vfa_std\"]} mm²')
      print(f'PMA mean: {summary[\"pma_mean\"]} ± {summary[\"pma_std\"]} mm²')
      print(f'Confidence mean: {summary[\"confidence_mean\"]} ± {summary[\"confidence_std\"]}')

  " &&

  echo "=== Comp2Comp VFA/PMA Inference Pipeline Completed Successfully ==="

inputs:
  amos_data:
    type: uri_folder
    path: azureml://datastores/amos22imagestr/paths/
    mode: ro_mount

outputs:
  inference_results:
    type: uri_folder
    mode: rw_mount