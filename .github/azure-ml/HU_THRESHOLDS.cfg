# HU (Hounsfield Unit) Threshold Configuration
# For L3 VFA/PMA/SMA Analysis
# Based on tissue-specific HU ranges

[TISSUE_HU_RANGES]
# Muscle Tissue (PMA - Psoas Muscle Area)
muscle_hu_min = -29
muscle_hu_max = 150
muscle_name = "Muscle (PMA/SMA)"
muscle_description = "Psoas and skeletal muscle tissue"

# Visceral Fat (VAT - Visceral Adipose Tissue)
vat_hu_min = -150
vat_hu_max = -50
vat_name = "Visceral Fat (VAT)"
vat_description = "Fat inside peritoneal cavity"

# Subcutaneous Fat (SAT)
sat_hu_min = -190
sat_hu_max = -30
sat_name = "Subcutaneous Fat (SAT)"
sat_description = "Fat directly under skin"

# Supporting tissues
air_hu = -1000
water_hu = 0
bone_hu_min = 200
bone_hu_max = 3000

[COMPUTATION_RULES]
# When measuring VFA/PMA from HU slice:

1. Muscle (PMA) Calculation
   - Include all pixels where: -29 ≤ HU ≤ +150
   - Exclude vertebra (HU > 200)
   - Exclude fat (HU < -150)
   - Unit: mm² (after pixel-to-mm conversion)

2. Visceral Fat (VAT) Calculation
   - Include all pixels where: -150 ≤ HU ≤ -50
   - Must be inside peritoneal boundary (defined by fascia)
   - Exclude subcutaneous fat (use SAT range to classify)
   - Unit: mm² (after pixel-to-mm conversion)

3. Subcutaneous Fat (SAT) Calculation (Optional)
   - Include all pixels where: -190 ≤ HU ≤ -30
   - Outside peritoneal cavity
   - Useful for total body composition

[REFERENCE_TISSUE_VALUES]
# Clinical reference HU values for tissues

Air                 = -1000 HU   (Black)
Fat                 = -100 HU    (Dark gray)
Muscle              = +40 HU     (Medium gray)
Blood               = +45 HU     (Medium gray)
Organ (liver)       = +60 HU     (Gray)
Soft tissue (water) = 0 HU       (Gray)
Bone                = +300 HU    (Bright white)
Dense bone          = +1000+ HU  (Very bright)

[ACCURACY_NOTES]
1. Threshold ranges are tissue-specific
   - Overlaps may occur (e.g., fat vs low-density muscle)
   - Use anatomical context + masking to disambiguate

2. Machine calibration matters
   - Different CT scanners may have ±5-10 HU variation
   - Use calibration phantom for precise measurements

3. Window/Level settings in viewing don't affect raw data
   - We use raw HU values from DICOM
   - Display windows are just for visualization

[VALIDATION]
# How to verify threshold accuracy:

1. Overlay test
   - Apply HU thresholds to visualization
   - Verify muscle is in expected location (around vertebra)
   - Verify VAT is inside abdominal cavity
   - Verify SAT is subcutaneous layer

2. Comparison with manual
   - Have radiologist manually segment slice
   - Compare auto-detected area vs manual
   - Adjust thresholds if MAE > 5%

3. Statistics check
   - VFA: 5000-20000 mm² (typical obese patient)
   - PMA: 800-1500 mm² (typical adult)
   - SAT: 10000-50000 mm² (varies widely)

[IMPLEMENTATION_IN_CODE]
# Python usage example:

import numpy as np

# Load HU slice
hu_slice = load_ct_slice()  # shape: (512, 512)

# Detect tissues by HU range
muscle_mask = (hu_slice >= -29) & (hu_slice <= 150)
vat_mask = (hu_slice >= -150) & (hu_slice <= -50)
sat_mask = (hu_slice >= -190) & (hu_slice <= -30)

# Exclude vertebra from muscle
bone_mask = hu_slice > 200
muscle_mask = muscle_mask & ~bone_mask

# Calculate areas (mm²)
pixel_area = (pixel_spacing_x * pixel_spacing_y)  # mm²/pixel
pma_mm2 = np.sum(muscle_mask) * pixel_area
vat_mm2 = np.sum(vat_mask) * pixel_area
sat_mm2 = np.sum(sat_mask) * pixel_area

print(f"PMA: {pma_mm2:.1f} mm²")
print(f"VAT: {vat_mm2:.1f} mm²")
print(f"SAT: {sat_mm2:.1f} mm²")
