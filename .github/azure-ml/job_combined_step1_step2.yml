$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: PRODUCTION - Two-Stage L3 Psoas (240 cases, FULL)
description: "Two-stage: Stage 1 (L3 detection, fast=True) + Stage 2 (psoas on single slice) - FULL PRODUCTION"

code: .

command: |
  set -e
  echo "========== COMBINED PIPELINE: STEP 1 + STEP 2 =========="
  python -m pip install --upgrade pip > /dev/null 2>&1
  pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
  pip install -q TotalSegmentator nnunetv2
  echo ""
  echo "========== STEP 1: Two-Stage L3 Psoas Segmentation =========="
  echo "Stage 1: L3 detection (task=total, fast=True, LOW RAM)"
  echo "Stage 2: Psoas on L3 slice only (task=abdominal_muscles, LOW RAM)"
  STEP1_SCRIPT=$(find . -name "step1_two_stage_l3_psoas.py" -type f | head -1)
  python "$STEP1_SCRIPT" --input-data ${{inputs.amos_data}} --output-dir ./teacher_labels_generated
  echo "✅ Step 1 completed: Teacher labels generated"
  echo ""
  ls -la ./teacher_labels_generated
  echo ""
  echo "========== STEP 2: U-Net Training (10 epochs test) =========="
  echo "Training MONAI U-Net on generated teachers..."
  STEP2_SCRIPT=$(find . -name "step2_train_unet.py" -type f | head -1)
  python "$STEP2_SCRIPT" --teacher-dir ./teacher_labels_generated --output-dir ${{outputs.trained_model}} --epochs 60 --batch-size 8 --img-size 256 --lr 0.001
  echo "✅✅✅ PIPELINE COMPLETED SUCCESSFULLY! ✅✅✅"

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest

compute: azureml:l3-train-cpu

environment_variables:
  PYTHONPATH: /workspace
  OMP_NUM_THREADS: "8"
  PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:128

inputs:
  amos_data:
    type: uri_folder
    path: azureml://datastores/amos22imagestr/paths/

outputs:
  trained_model:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/trained_models/${{name}}
